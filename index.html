            height: 100%;

        .logo {

            align-items: center;
            justify-content: center;

        }
        
        .logo-text h1 {

            background: linear-gradient(90deg, #a855f7, #ec4899);

            margin: 0;

        // Parsear M3U
        function parseM3U(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const channels = [];
            let currentChannel = null;
            
            console.log('📄 Parseando', lines.length, 'líneas...');
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {
                        name: '',
                        logo: '',
                        group: 'Sin categoría',
                        url: '',
                        keyId: '',
                        key: ''
                    };
                    
                    const nameMatch = line.match(/,(.+)$/);
                    if (nameMatch) {
                        currentChannel.name = nameMatch[1].trim();
                    }
                    
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if (logoMatch) {
                        currentChannel.logo = logoMatch[1];
                    }
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) {
                        currentChannel.group = groupMatch[1];
                    }
                    
                } else if (line.startsWith('#KODIPROP:')) {
                    if (currentChannel && line.includes('inputstream.adaptive.license_key')) {
                        const keyMatch = line.match(/license_key=([^:]+):(.+)/);
                        if (keyMatch) {
                            currentChannel.keyId = keyMatch[1].trim();
                            currentChannel.key = keyMatch[2].trim();
                        }
                    }
                } else if ((line.startsWith('https://') || line.startsWith('http://')) && currentChannel) {
                    currentChannel.url = line.split('|')[0].trim();
                    
                    if (currentChannel.name && currentChannel.url) {
                        channels.push(currentChannel);
                        console.log('✅ Canal:', currentChannel.name);
                    }
                    currentChannel = null;
                }
            }
            
            console.log('📺 Total canales:', channels.length);
            return channels;
        }

        // Mostrar canales

                <div class="channel-grid">
                    ${channels.map((channel, index) => `
                        <div class="channel-card ${currentChannelIndex === allChannels.indexOf(channel) ? 'active' : ''}" 
                             onclick="playChannel(${allChannels.indexOf(channel)})" 
                             tabindex="${10 + index}">
                            <div class="channel-number">${allChannels.indexOf(channel) + 1}</div>
                            <div class="channel-logo">
                                ${channel.logo ? `<img src="${channel.logo}" alt="${channel.name}" onerror="this.style.display='none'">` : '📺'}
                            </div>
                            <div class="channel-name">${channel.name}</div>
                            <div class="channel-category">${channel.group}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Mostrar categorías
        function displayCategories() {
            const categories = {};
            
            allChannels.forEach(channel => {
                if (!categories[channel.group]) {
                    categories[channel.group] = 0;
                }
                categories[channel.group]++;
            });
            
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = `
                <div class="category-item ${currentCategory === 'Todos' ? 'active' : ''}" onclick="filterByCategory('Todos')">
                    <span>📺 Todos</span>
                    <span class="category-count">${allChannels.length}</span>
                </div>
                ${Object.entries(categories).sort().map(([cat, count]) => `
                    <div class="category-item ${currentCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat.replace(/'/g, "\\'")}')">
                        <span>${cat}</span>
                        <span class="category-count">${count}</span>
                    </div>
                `).join('')}
            `;
        }
        
        // Filtrar por categoría
        function filterByCategory(category) {
            currentCategory = category;
            
            if (category === 'Todos') {
                displayChannels(allChannels);
                document.getElementById('categoryTitle').textContent = `Todos los Canales (${allChannels.length})`;
            } else {
                const filtered = allChannels.filter(ch => ch.group === category);
                displayChannels(filtered);
                document.getElementById('categoryTitle').textContent = `${category} (${filtered.length})`;
            }
            
            displayCategories();
            toggleSidebar();
        }
        
        // Reproducir canal usando HTML5 Video nativo
        async function playChannel(index) {
            const channel = allChannels[index];
            
            if (!channel || !channel.url) {
                console.error('❌ Canal inválido');
                return;
            }
            
            currentChannelIndex = index;
            
            console.log('🎬 Reproduciendo:', channel.name);
            console.log('🔗 URL:', channel.url);
            
            document.getElementById('videoName').textContent = channel.name;
            document.getElementById('channelBadge').textContent = `Canal ${index + 1}`;
            document.getElementById('videoSection').classList.add('active');
            
            // Actualizar tarjetas activas
            displayChannels(allChannels.filter(ch => 
                currentCategory === 'Todos' || ch.group === currentCategory
            ));
            
            try {
                player = document.getElementById('videoPlayer');
                
                // Detener reproducción anterior
                player.pause();
                player.removeAttribute('src');
                player.load();
                
                const isMPD = channel.url.includes('.mpd');
                const isM3U8 = channel.url.includes('.m3u8');
                const isTS = channel.url.includes('.ts');
                
                if (isM3U8) {
                    console.log('📺 Stream HLS detectado');
                    
                    // Usar HLS.js si está disponible, sino HTML5 nativo
                    if (player.canPlayType('application/vnd.apple.mpegurl')) {
                        player.src = channel.url;
                    } else {
                        // Fallback a reproducción directa
                        player.src = channel.url;
                    }
                } else if (isMPD) {
                    console.log('📺 Stream DASH detectado (requiere soporte del navegador)');
                    player.src = channel.url;
                } else if (isTS) {
                    console.log('📺 Stream TS detectado');
                    player.src = channel.url;
                } else {
                    console.log('📺 Stream estándar');
                    player.src = channel.url;
                }
                
                player.load();
                
                // Intentar reproducir
                const playPromise = player.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('▶️ Reproducción iniciada');
                    }).catch(err => {
                        console.warn('⚠️ Auto-play bloqueado:', err.message);
                        // El usuario deberá hacer clic en play manualmente
                    });
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                alert('Error al reproducir: ' + error.message + '\n\nIntenta con otro canal.');
            }
            
            // Scroll suave al reproductor
            document.getElementById('videoSection').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        }
        
        // Canal siguiente (zapping)
        function nextChannel() {
            if (allChannels.length === 0) return;
            
            currentChannelIndex = (currentChannelIndex + 1) % allChannels.length;
            playChannel(currentChannelIndex);
        }
        
        // Canal anterior (zapping)
        function previousChannel() {
            if (allChannels.length === 0) return;
            
            currentChannelIndex = currentChannelIndex <= 0 ? allChannels.length - 1 : currentChannelIndex - 1;
            playChannel(currentChannelIndex);
        }
        
        // Toggle sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }
        
        // Búsqueda
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            
            if (searchTerm === '') {
                filterByCategory(currentCategory);
                return;
            }
            
            const filtered = allChannels.filter(channel => 
                channel.name.toLowerCase().includes(searchTerm) ||
                channel.group.toLowerCase().includes(searchTerm)
            );
            
            displayChannels(filtered);
            document.getElementById('categoryTitle').textContent = `Resultados: "${searchTerm}" (${filtered.length})`;
        });
        
        // Control remoto Android TV - Navegación con teclado
        document.addEventListener('keydown', (e) => {
            console.log('🎮 Tecla presionada:', e.key, e.keyCode);
            
            switch(e.keyCode) {
                case 37: // Flecha izquierda
                case 227: // Botón rewind Android TV
                    e.preventDefault();
                    previousChannel();
                    break;
                    
                case 39: // Flecha derecha
                case 228: // Botón forward Android TV
                    e.preventDefault();
                    nextChannel();
                    break;
                    
                case 38: // Flecha arriba
                    e.preventDefault();
                    if (currentChannelIndex - 4 >= 0) {
                        playChannel(currentChannelIndex - 4);
                    }
                    break;
                    
                case 40: // Flecha abajo
                    e.preventDefault();
                    if (currentChannelIndex + 4 < allChannels.length) {
                        playChannel(currentChannelIndex + 4);
                    }
                    break;
                    
                case 13: // Enter
                case 23: // Select Android TV
                    e.preventDefault();
                    if (player && player.paused) {
                        player.play();
                    }
                    break;
                    
                case 179: // Play/Pause media key
                case 32: // Spacebar
                    e.preventDefault();
                    if (player) {
                        if (player.paused) {
                            player.play();
                        } else {
                            player.pause();
                        }
                    }
                    break;
                    
                case 166: // Channel Up
                case 33: // Page Up
                    e.preventDefault();
                    nextChannel();
                    break;
                    
                case 167: // Channel Down
                case 34: // Page Down
                    e.preventDefault();
                    previousChannel();
                    break;
                    
                case 77: // Tecla M - Menu
                case 82: // Tecla R - Menu Android TV
                    e.preventDefault();
                    toggleSidebar();
                    break;
                    
                case 27: // ESC - Cerrar sidebar
                case 4: // Back Android TV
                    e.preventDefault();
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar.classList.contains('open')) {
                        toggleSidebar();
                    }
                    break;
                    
                // Números directos (0-9) para cambio rápido de canal
                case 48: case 96: playChannel(0); break; // 0
                case 49: case 97: playChannel(1); break; // 1
                case 50: case 98: playChannel(2); break; // 2
                case 51: case 99: playChannel(3); break; // 3
                case 52: case 100: playChannel(4); break; // 4
                case 53: case 101: playChannel(5); break; // 5
                case 54: case 102: playChannel(6); break; // 6
                case 55: case 103: playChannel(7); break; // 7
                case 56: case 104: playChannel(8); break; // 8
                case 57: case 105: playChannel(9); break; // 9
            }
        });
        
        // Gestos táctiles para móviles
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.getElementById('videoPlayer').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.getElementById('videoPlayer').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left - siguiente canal
                    nextChannel();
                } else {
                    // Swipe right - canal anterior
                    previousChannel();
                }
            }
        }
        
        // Prevenir comportamiento por defecto del control remoto
        window.addEventListener('keydown', (e) => {
            // Prevenir scroll de página con flechas
            if([37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
        }, false);
        
        // Detectar si estamos en Android TV
        function isAndroidTV() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.includes('android') && (
                ua.includes('tv') || 
                ua.includes('aftm') || 
                ua.includes('aftb') ||
                window.innerWidth >= 1280
            );
        }
        
        // Ajustes para Android TV
        if (isAndroidTV()) {
            console.log('📺 Modo Android TV activado');
            document.body.style.cursor = 'none';
            
            // Hacer que los elementos sean más focalizables
            const style = document.createElement('style');
            style.textContent = `
                *:focus {
                    outline: 3px solid #a855f7 !important;
                    outline-offset: 2px;
                }
            `;
            document.head.appendChild(style);
        }
        
        // Mostrar ayuda de controles al iniciar
        function showControlsHelp() {
            const isTV = isAndroidTV();
            const helpText = isTV ? 
                '🎮 Controles Android TV:\n\n' +
                '◄► Flechas: Cambiar canal\n' +
                '↑↓ Flechas: Saltar 4 canales\n' +
                'Enter/Select: Play/Pause\n' +
                'Menu (M): Abrir categorías\n' +
                'Back (ESC): Cerrar menú\n' +
                'CH+/CH-: Siguiente/Anterior\n' +
                '0-9: Selección rápida' :
                '📱 Controles Móvil:\n\n' +
                '◄► Botones: Cambiar canal\n' +
                '👆 Deslizar: Cambiar canal\n' +
                '🔍 Buscar: Filtrar canales\n' +
                '☰ Menú: Ver categorías';
            
            console.log(helpText);
        }
        
        // Inicializar aplicación
        console.log('🚀 Iniciando SENSA TV...');
        console.log('🌐 User Agent:', navigator.userAgent);
        
        loadChannels();
        showControlsHelp();
        
        // Mensaje de bienvenida
        setTimeout(() => {
            if (allChannels.length > 0 && currentChannelIndex === -1) {
                console.log('💡 Tip: Selecciona un canal para comenzar');
            }
        }, 2000);
    </script>
</body>
</html>
